apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dufyn-manager
  namespace: dufyn
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dufyn.example.test
      secretName: dufyn-tls
  rules:
    - host: dufyn.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dufyn-manager
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dufyn-controller
  namespace: dufyn
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dufyn-api.example.test
      secretName: dufyn-tls
  rules:
    - host: dufyn-api.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dufyn-controller
                port:
                  number: 8000