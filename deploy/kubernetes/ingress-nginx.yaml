apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dufyn-manager
  namespace: dufyn
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  tls:
    - hosts:
        - dufyn.example.test
      secretName: dufyn-tls
  rules:
    - host: dufyn.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dufyn-manager
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dufyn-controller
  namespace: dufyn
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  tls:
    - hosts:
        - dufyn-api.example.test
      secretName: dufyn-tls
  rules:
    - host: dufyn-api.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dufyn-controller
                port:
                  number: 8000