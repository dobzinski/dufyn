apiVersion: v1
kind: Service
metadata:
  name: dufyn-database
spec:
  selector:
    app: dufyn-database
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dufyn-database
spec:
  serviceName: dufyn-database
  replicas: 1
  selector:
    matchLabels: &id001
      app: dufyn-database
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: dufyn-database
        image: dufyn-database:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - /opt/dufyn/database/control.sh
        args:
        - postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: dufyn-database
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dufyn-database
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_APP_USER
          valueFrom:
            secretKeyRef:
              name: dufyn-app-database
              key: username
              optional: true
        - name: POSTGRES_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dufyn-app-database
              key: password
              optional: true
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: maintenance
          mountPath: /opt/dufyn/database/restore
          subPath: database/restore
        - name: maintenance
          mountPath: /opt/dufyn/database/upgrade
          subPath: database/upgrade
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - configMapRef:
            name: dufyn-database-config
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-dufyn-database-0
      - name: maintenance
        persistentVolumeClaim:
          claimName: dufyn-maintenance
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
