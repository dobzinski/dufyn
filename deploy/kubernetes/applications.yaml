            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: dufyn-manager-config
      - name: temporary
        emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: dufyn-controller
spec:
  selector:
    app: dufyn-controller
  ports:
  - name: http
    port: 8000
    targetPort: http
