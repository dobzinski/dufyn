            secretKeyRef:
              name: dufyn-database
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dufyn-database
              key: password
        - name: PKI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: dufyn-pki
              key: master-key
              optional: true
        - name: POSTGRES_APP_USER
          valueFrom:
            secretKeyRef:
              name: dufyn-app-database
              key: username
              optional: true
        - name: POSTGRES_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dufyn-app-database
              key: password
              optional: true
        volumeMounts:
        - name: config
