# Fill locally before applying. Never commit real credentials.
# Apply explicitly: kubectl apply -f deploy/kubernetes/secrets.yaml
# This template is intentionally NOT included in kustomization.yaml:
# ordinary apply -k must not overwrite credentials with empty template values.
# database.password: required before the first database start.
# manager.username/password: required when access.login is enabled.
# pki.master-key: use the SAME persistent PKI_MASTER_KEY for existing encrypted data.
# scanner.token: token issued by Manager; tsig-secret is optional.
apiVersion: v1
kind: Secret
metadata:
  name: dufyn-database
  namespace: dufyn
type: Opaque
stringData:
  username: dufyn
  password: ''
---
apiVersion: v1
kind: Secret
metadata:
  name: dufyn-manager
  namespace: dufyn
type: Opaque
stringData:
  username: 'admin'
  password: '' # Set a strong unique password when enabling Manager login.
---
apiVersion: v1
kind: Secret
metadata:
  name: dufyn-pki
  namespace: dufyn
type: Opaque
stringData:
  master-key: ''
---
apiVersion: v1
kind: Secret
metadata:
  name: dufyn-scanner
  namespace: dufyn
type: Opaque
stringData:
  token: ''
  tsig-secret: ''
---
# Application role is created by control.sh when both credentials are filled.
apiVersion: v1
kind: Secret
metadata:
  name: dufyn-app-database
  namespace: dufyn
type: Opaque
stringData:
  username: dufyn_app
  password: ''
