access:
  login: false
  session: 3600 # Seconds without user activity before signing out.

password:
  manager: false

logo:
  animate: false

controller:
  url: "http://controller:8000"
  ca_file: null # Optional PEM CA file inside the container, e.g. /opt/dufyn/certs/ca.crt.

tls:
  # Remaining whole days, inclusive. Expired certificates always use expired.
  expiration:
    warning_days: 90
    critical_days: 30
  # Classifies the negotiated version; independent of certificate expiration.
  versions:
    SSLv2: critical
    SSLv3: critical
    TLSv1: critical
    TLSv1.1: critical
    TLSv1.2: warning # Local policy encouraging migration to TLS 1.3.
    TLSv1.3: valid
  default: unknown

self-signed:
  key_algorithm: RSA
  rsa_key_size: 2048
  signature_hash: SHA256

# Public API: records first observed within this rolling number of days.
newers:
  days: 5 # 0 disables /v1/public/newers without changing scanner collection.

# Time Converter options. value is an IANA identifier; label is shown in the UI.
time:
  timezones:
    - value: UTC
      label: UTC
    - value: America/Sao_Paulo
      label: Sao Paulo
    - value: America/New_York
      label: New York
    - value: Europe/London
      label: London
    - value: Asia/Tokyo
      label: Tokyo
