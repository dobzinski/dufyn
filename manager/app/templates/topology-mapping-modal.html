    <dialog id="mapping-modal" class="network-map-modal" aria-labelledby="mapping-title">
        <header class="network-map-header">
            <div><h2 id="mapping-title">Associations</h2><p id="mapping-subtitle"></p></div>
            <button id="mapping-close" class="secondary-button" type="button">Close</button>
        </header>
        <div class="panel-body">
            <details id="mapping-accordion" class="panel form-panel">
                <summary class="panel-header form-summary">
                    <div>
                        <h2 id="mapping-form-title">New</h2>
                        <p>Form for the asset association</p>
                    </div>
                    <span class="form-chevron" aria-hidden="true"></span>
                </summary>
                <div class="panel-body panel-form">
                    <form id="mapping-form" class="form">
                        <input type="hidden" name="topology_view_id">
                        <label for="mapping-asset">Asset</label>
                        <select id="mapping-asset" name="asset_id" required><option value="">Select ...</option></select>
                        <label for="mapping-parent">Parent (optional)</label>
                        <select id="mapping-parent" name="parent_id"><option value="">None (root)</option></select>
                        <div class="form-actions">
                            <button id="mapping-submit" class="secondary-button form-primary-button" type="submit" data-button-icon="add">Add</button>
                            <button id="mapping-cancel" data-form-cancel class="secondary-button form-secondary-button" type="button" hidden data-button-icon="cancel">Cancel</button>
                        </div>
                        <p class="message" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </details>
            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2>Data</h2>
                        <p>Manage assets associated with this view.</p>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="table-wrapper">
                        <table id="mapping-table" class="data-table record-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Asset</th>
                                    <th>IP Address</th>
                                    <th>Type</th>
                                    <th>Parent</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="7" class="table-message">Loading associations...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p id="mapping-message" class="message" role="status" aria-live="polite"></p>
                    <button id="mapping-retry" class="secondary-button" type="button" hidden>Retry loading</button>
                </div>
            </section>
        </div>
        <div id="mapping-actions" class="row-actions-menu" role="menu" aria-label="Association actions" hidden>
            <button data-action="edit" class="row-action-primary" type="button" role="menuitem" data-button-icon="edit">Edit</button>
            <button data-action="delete" class="row-action-secondary" type="button" role="menuitem" data-button-icon="delete">Delete</button>
        </div>
    </dialog>
